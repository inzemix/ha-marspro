fetch_alarm_feed:
  name: Fetch the alarm log
  description: >
    Read-only diagnostic: returns the notifications and alarms the Mars Pro
    cloud records for your account (its server-side message list). Nothing is
    written and no command is sent to any device.

    It exists because a device frame tells us *that* an alarm happened, never
    *why* - on an iHub the alarm record carries no cause. The cloud feed does
    carry an alarm type. The result is returned directly in Developer tools ->
    Actions, so it can be copied and shared.

    Warning: an empty reply is a real possible answer. On the iHub account it
    was tested against, the feed returned no record at all, even right after a
    confirmed alarm - so `ok: true, count: 0` means the endpoint answered and
    simply has nothing to give. It is not proof that anything is broken.
  fields:
    page:
      name: Page
      description: Which page of the feed to read (1 = most recent).
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 20

generate_device_report:
  name: Generate device support report
  description: >
    Probes the devices on your Mars Pro account that this integration does not
    support yet, and writes a report you can send us so support can be added.

    Read-only by default: only getDevSta, getSysSta and getConfigFile are sent
    to the devices - nothing is ever switched on or off, and no configuration
    is written. The report is saved in your Home Assistant configuration folder
    and a notification links to it.

    The report also lists the actuators the device reports (each one becomes a
    Home Assistant entity), the exact requests that were sent, and a few
    questions about your setup - so support can usually be added without any
    further back and forth.

    A report is also generated automatically when an unsupported device is
    detected, so you normally never need to call this action yourself.
  fields:
    include_supported:
      name: Include supported devices
      description: >
        Also probe the devices that already work, for comparison. Rarely needed.
      required: false
      default: false
      selector:
        boolean:
    test_writes:
      name: Test write commands (experimental)
      description: >
        Also check whether the device accepts commands. This sends
        setConfigField with the values the device itself just reported, so
        nothing changes state - it exists to prove the device is controllable
        before spending time on an implementation. Leave off unless asked.
      required: false
      default: false
      selector:
        boolean:
    wait_seconds:
      name: Wait time
      description: How long to wait for each device's reply, in seconds.
      required: false
      default: 12
      selector:
        number:
          min: 3
          max: 60
          unit_of_measurement: seconds
